name: Claim Check

# Informational only — no branch protection makes this a required check
# (the team decided against locking `main`, see PLANNING.md). It exists so a
# PR that closes an issue nobody claimed shows a visible, explained red X
# instead of the mismatch going unnoticed until the PM catches it later.

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  issues: read
  pull-requests: read

jobs:
  verify-claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const author = context.payload.pull_request.user.login.toLowerCase();
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)/gi;
            const numbers = [...new Set([...body.matchAll(re)].map((m) => parseInt(m[1], 10)))];
            const { owner, repo } = context.repo;

            if (numbers.length === 0) {
              console.log("No 'Closes #N' / 'Fixes #N' found in the PR body — nothing to verify (not every PR closes a tracked issue).");
              return;
            }

            const problems = [];
            for (const n of numbers) {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: n });
              const assignees = (issue.assignees || []).map((a) => a.login.toLowerCase());
              if (!assignees.includes(author)) {
                problems.push(`#${n} is not assigned to @${author} (current assignee(s): ${assignees.join(", ") || "none"}).`);
              }
            }

            if (problems.length) {
              core.setFailed(
                "Claim check failed:\n" +
                  problems.join("\n") +
                  "\n\nSelf-assign the linked issue(s) to claim it first (this flips status:todo -> status:in-progress " +
                  "automatically, see .github/workflows/issue-automation.yml) — see CONTRIBUTING.md#claim-a-task-before-you-start. " +
                  "This check does not block merge (no branch protection is applied on this repo), but a red X here means " +
                  "the issue board and this PR are out of sync."
              );
            } else {
              console.log(`Claim check passed for: ${numbers.map((n) => "#" + n).join(", ")}`);
            }
