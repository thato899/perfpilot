# Alembic configuration for apps/api.
#
# Deliberately NOT at the repository root: root config is a shared path
# (CONTRIBUTING.md), and migrations belong to apps/api's owner. Run it from
# the repository root so root-relative imports (apps.api.*, packages.*)
# resolve the way they do in CI and in the container:
#
#   alembic -c apps/api/alembic.ini upgrade head
#   alembic -c apps/api/alembic.ini revision --autogenerate -m "describe it"
#   alembic -c apps/api/alembic.ini downgrade -1
#
# See docs/development/local-development.md#database-migrations.

[alembic]
# Relative to the directory alembic is invoked from (the repository root).
script_location = apps/api/alembic

# Puts the repository root on sys.path, so `import apps.api.db.models`
# and `import packages.schemas...` resolve. Same convention as
# pyproject.toml's `pythonpath = ["."]` for pytest.
prepend_sys_path = .

# Date-prefixed revision filenames so `ls versions/` reads chronologically
# instead of as a pile of opaque hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# No sqlalchemy.url here on purpose. env.py reads DATABASE_URL from the
# environment (see .env.example) so a connection string — which in
# production is a secret — is never committed to this file.

[post_write_hooks]
# Newly generated migrations are formatted on the way out, so an
# autogenerated file can't be what turns CI's py-format job red.
#
# black only, not ruff: ruff is a Rust binary whose wheel exposes no
# console_scripts entry point, so `ruff.type = console_scripts` fails
# outright, and `exec` would need it on PATH — which it often isn't on
# Windows (pip's Scripts\ directory). black does declare an entry point, so
# console_scripts imports it straight from the interpreter running alembic
# and works regardless of PATH. Import order in generated migrations comes
# from script.py.mako anyway; CI's py-lint is the real ruff gate.
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
